<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>westkleding</title>
<meta name="description" content="Leave your email to know when new westkleding pieces are ready to order.">
<script>document.documentElement.classList.add('js');</script>

<!-- Social preview -->
<meta property="og:title" content="westkleding">
<meta property="og:description" content="Made to be worn.">
<meta property="og:image" content="logo.png">
<meta property="og:type" content="website">

<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #0a0a0a;
    --ink-60: rgba(10,10,10,0.62);
    --ink-30: rgba(10,10,10,0.28);
    --paper: #f1efe9;
    --paper-dim: #e5e2d8;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    align-items: center;
  }

  .wrap {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 10vh 8vw;
  }

  .col {
    max-width: 30rem;
  }

  .mark {
    height: clamp(64px, 9vw, 96px);
    width: auto;
    display: block;
  }

  .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(2.1rem, 5.4vw, 3.1rem);
    letter-spacing: -0.01em;
    margin: 0.6em 0 0.35em;
  }

  .tagline {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: clamp(1.05rem, 2.2vw, 1.25rem);
    margin: 0;
    color: var(--ink);
  }

  .divider {
    width: 84px;
    height: 2px;
    background: var(--ink);
    transform: rotate(-13deg);
    margin: 2.75rem 0 2.5rem -4px;
  }

  /* Entrance animation only applies once JS confirms it can run, and only
     un-hides on the reveal class — content is visible by default otherwise. */
  html.js .mark,
  html.js .wordmark,
  html.js .tagline,
  html.js .divider {
    opacity: 0;
    transform: translateY(10px);
  }
  html.js .divider { transform: rotate(-13deg) translateY(10px); }

  .lede {
    font-size: 1rem;
    line-height: 1.65;
    color: var(--ink-60);
    margin: 0 0 2.25rem;
    max-width: 34ch;
  }

  form {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--ink);
    max-width: 26rem;
  }

  .field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    padding-bottom: 0.85rem;
  }

  label {
    font-size: 0.8rem;
    color: var(--ink-60);
  }

  input[type="email"] {
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    color: var(--ink);
    background: transparent;
    border: none;
    padding: 0;
    outline: none;
  }

  input[type="email"]::placeholder {
    color: var(--ink-30);
  }

  button {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--paper);
    background: var(--ink);
    border: 1px solid var(--ink);
    padding: 0 1.5rem;
    margin-bottom: 0.85rem;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: default; }

  input:focus-visible,
  button:focus-visible,
  .ig-link:focus-visible,
  .footer-link:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  .status {
    font-size: 0.9rem;
    margin-top: 0.9rem;
    min-height: 1.2em;
  }

  .status.ok { color: var(--ink); }
  .status.err { color: var(--ink-60); }

  footer {
    margin-top: 3.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 1.1rem;
    align-items: center;
    font-size: 0.85rem;
    color: var(--ink-60);
  }

  .ig-link {
    display: inline-flex;
    color: var(--ink);
    transition: opacity 0.15s ease;
  }

  .ig-link:hover { opacity: 0.65; }

  .footer-link {
    color: var(--ink-60);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .footer-link:hover {
    color: var(--ink);
    border-color: var(--ink-30);
  }

  html.is-ready .mark { opacity: 1; transform: translateY(0); transition: opacity 0.6s ease, transform 0.6s ease; }
  html.is-ready .wordmark { opacity: 1; transform: translateY(0); transition: opacity 0.6s ease 0.08s, transform 0.6s ease 0.08s; }
  html.is-ready .tagline { opacity: 1; transform: translateY(0); transition: opacity 0.6s ease 0.16s, transform 0.6s ease 0.16s; }
  html.is-ready .divider { opacity: 1; transform: rotate(-13deg) translateY(0); transition: opacity 0.6s ease 0.26s, transform 0.6s ease 0.26s; }

  @media (prefers-reduced-motion: reduce) {
    html.js .mark, html.js .wordmark, html.js .tagline, html.js .divider {
      opacity: 1 !important; transform: none !important; transition: none !important;
    }
    html.js .divider { transform: rotate(-13deg) !important; }
  }

  @media (max-width: 520px) {
    .wrap { padding: 9vh 7vw; }
    .divider { margin-top: 2.25rem; margin-bottom: 2rem; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="col">
      <img class="mark" src="logo.png" alt="westkleding">
      <h1 class="wordmark">WESTKLEDING</h1>
      <p class="tagline">Made to be worn.</p>

      <div class="divider"></div>

      <p class="lede">Leave your email and you'll be the first to know when new pieces are ready to order.</p>

      <form id="waitlist-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@email.com" required>
        </div>
        <button type="submit" id="submit-btn">Notify me</button>
      </form>
      <p class="status" id="form-status"></p>

      <footer>
        <a href="https://instagram.com/westkleding" target="_blank" rel="noopener" class="ig-link" aria-label="westkleding on Instagram">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="5.5"/>
            <circle cx="12" cy="12" r="4.3"/>
            <circle cx="17.3" cy="6.7" r="0.65" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <span>&copy; 2026 westkleding</span>
        <a href="privacy.html" class="footer-link">Privacy</a>
        <a href="terms.html" class="footer-link">Terms</a>
      </footer>
    </div>
  </div>

<script>
  requestAnimationFrame(() => {
    requestAnimationFrame(() => document.documentElement.classList.add('is-ready'));
  });

  const form = document.getElementById('waitlist-form');
  const status = document.getElementById('form-status');
  const btn = document.getElementById('submit-btn');

  const FORMSPREE_ENDPOINT = 'https://formspree.io/f/xeaqbnbd';

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Sending…';
    status.textContent = '';
    status.className = 'status';

    try {
      const res = await fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new FormData(form)
      });

      if (res.ok) {
        form.reset();
        status.textContent = "You're on the list — we'll email you when it drops.";
        status.classList.add('ok');
        btn.textContent = 'Notify me';
      } else {
        throw new Error('Request failed');
      }
    } catch (err) {
      status.textContent = "Something went wrong — try again in a moment.";
      status.classList.add('err');
      btn.textContent = 'Notify me';
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
